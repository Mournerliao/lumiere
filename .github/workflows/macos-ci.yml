name: macOS Shell CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  shell:
    name: Check, test, and build shared shell
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify shared shell
        run: |
          pnpm check
          pnpm test
          pnpm build
