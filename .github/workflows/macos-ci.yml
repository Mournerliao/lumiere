name: macOS Shell CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  shell:
    name: Check, test, and build shared shell
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify shared shell
        run: |
          pnpm check
          pnpm test
          pnpm build
