name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Restore, build, test, and format
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install shell dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify shared shell
        run: |
          pnpm check
          pnpm test
          pnpm build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify repository
        shell: pwsh
        run: ./hosts/windows/scripts/verify.ps1
