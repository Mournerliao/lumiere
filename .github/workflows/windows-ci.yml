name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Restore, build, test, and format
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install shell dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify shared shell
        run: |
          pnpm check
          pnpm test
          pnpm build

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Verify repository
        shell: pwsh
        run: ./hosts/windows/scripts/verify.ps1
