<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumiere - Capture Region Select</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Segoe UI Variable', 'Segoe UI', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Consolas', 'monospace'],
                    },
                    colors: {
                        windows: {
                            bg: '#111111',
                            panel: 'rgba(32, 32, 32, 0.75)',
                            border: 'rgba(255, 255, 255, 0.08)',
                            accent: '#0078D4',
                            accentHover: '#0086F0',
                            text: '#FFFFFF',
                            textMuted: '#A0A0A0',
                        }
                    },
                    boxShadow: {
                        'fluent': '0 8px 32px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05)',
                        'fluent-inner': 'inset 0 1px 0 rgba(255, 255, 255, 0.1)',
                    },
                    backdropBlur: {
                        'mica': '60px',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent; /* Changed for overlay effect */
            min-height: 100vh;
            display: flex;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        
        .mica-panel {
            background-color: var(--tw-colors-windows-panel, rgba(32, 32, 32, 0.75));
            backdrop-filter: blur(60px);
            -webkit-backdrop-filter: blur(60px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .fluent-button {
            position: relative;
            overflow: hidden;
        }
        
        .fluent-button::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .fluent-button:hover::after {
            opacity: 1;
        }

        /* Fullscreen Overlay specific styles */
        .capture-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            z-index: 50;
            cursor: crosshair;
        }

        /* The crop region hole-punch */
        .crop-region {
            position: absolute;
            top: 25%;
            left: 20%;
            width: 60%;
            height: 50%;
            border: 1px solid #0078D4;
            box-shadow: 0 0 15px rgba(0, 120, 212, 0.5), 0 0 0 9999px rgba(0, 0, 0, 0.4);
            background: transparent;
            z-index: 51;
            /* In a real app, clip-path or complex SVG masking is used for true hole-punch, 
               but box-shadow is a functional CSS approximation for this visual */
        }

        .resize-handle {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: white;
            border: 1px solid #0078D4;
            z-index: 52;
        }

        .handle-tl { top: -4px; left: -4px; cursor: nwse-resize; }
        .handle-tr { top: -4px; right: -4px; cursor: nesw-resize; }
        .handle-bl { bottom: -4px; left: -4px; cursor: nesw-resize; }
        .handle-br { bottom: -4px; right: -4px; cursor: nwse-resize; }

        /* Fake desktop background for context */
        .desktop-bg {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle at 50% 0%, #1e3a8a 0%, #000000 70%);
            z-index: -1;
        }
    </style>
</head>
<body class="text-windows-text antialiased selection:bg-windows-accent selection:text-white w-full h-screen">

    <!-- Simulated Desktop Background (behind the overlay) -->
    <div class="desktop-bg">
        <!-- App Container (Desaturated/behind overlay) -->
        <div class="flex w-full h-full max-w-[1440px] mx-auto p-4 gap-4 opacity-50 grayscale-[50%] pointer-events-none">
            
            <!-- Left Navigation Rail (from previous screen) -->
            <aside id="nav-rail" class="w-64 flex-shrink-0 flex flex-col gap-6 h-full mica-panel rounded-[12px] py-6 px-4">
                
                <!-- Branding / App Header -->
                <div class="flex items-center gap-3 px-2 mb-2">
                    <div class="w-8 h-8 rounded-md bg-windows-accent flex items-center justify-center shadow-[inset_0_1px_0_rgba(255,255,255,0.2)]">
                        <i class="fa-solid fa-camera-retro text-white text-sm"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-sm font-semibold tracking-wide text-white">Lumiere</span>
                        <span class="text-[10px] text-windows-textMuted uppercase tracking-widest font-mono">Capture Tool</span>
                    </div>
                </div>

                <!-- Navigation Links -->
                <nav class="flex-1 flex flex-col gap-1 overflow-y-auto">
                    
                    <!-- Section: Main -->
                    <div class="mb-4">
                        <h4 class="text-xs font-semibold text-windows-textMuted uppercase tracking-wider mb-2 px-2">Main</h4>
                        
                        <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-[6px] bg-windows-accent/10 border border-windows-accent/20 text-windows-accent relative group transition-colors">
                            <div class="absolute left-0 top-1/2 -translate-y-1/2 w-[3px] h-4 bg-windows-accent rounded-r-full"></div>
                            <i class="fa-solid fa-house w-5 text-center text-sm"></i>
                            <span class="text-sm font-medium">Dashboard</span>
                        </a>
                    </div>

                    <!-- Section: Settings -->
                    <div class="mb-4">
                        <h4 class="text-xs font-semibold text-windows-textMuted uppercase tracking-wider mb-2 px-2">Settings</h4>
                        
                        <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-[6px] text-windows-textMuted hover:text-white hover:bg-white/5 border border-transparent transition-colors group">
                            <i class="fa-solid fa-gear w-5 text-center text-sm group-hover:text-windows-accent transition-colors"></i>
                            <span class="text-sm font-medium">General</span>
                        </a>
                        
                        <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-[6px] text-windows-textMuted hover:text-white hover:bg-white/5 border border-transparent transition-colors group">
                            <i class="fa-solid fa-keyboard w-5 text-center text-sm group-hover:text-windows-accent transition-colors"></i>
                            <span class="text-sm font-medium">Shortcuts</span>
                        </a>
                        
                        <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-[6px] text-windows-textMuted hover:text-white hover:bg-white/5 border border-transparent transition-colors group">
                            <i class="fa-solid fa-palette w-5 text-center text-sm group-hover:text-windows-accent transition-colors"></i>
                            <span class="text-sm font-medium">HDR & Color</span>
                        </a>

                        <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-[6px] text-windows-textMuted hover:text-white hover:bg-white/5 border border-transparent transition-colors group">
                            <i class="fa-solid fa-file-export w-5 text-center text-sm group-hover:text-windows-accent transition-colors"></i>
                            <span class="text-sm font-medium">Output</span>
                        </a>
                    </div>

                    <!-- Section: Media -->
                    <div>
                        <h4 class="text-xs font-semibold text-windows-textMuted uppercase tracking-wider mb-2 px-2">Media</h4>
                        
                        <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-[6px] text-windows-textMuted hover:text-white hover:bg-white/5 border border-transparent transition-colors group">
                            <i class="fa-regular fa-images w-5 text-center text-sm group-hover:text-windows-accent transition-colors"></i>
                            <span class="text-sm font-medium">Gallery</span>
                            <span class="ml-auto text-[10px] bg-white/10 px-2 py-0.5 rounded-full text-white/70">12</span>
                        </a>
                    </div>

                </nav>
            </aside>
            <!-- Right Content Area (Placeholder for blur effect) -->
            <main class="flex-1 mica-panel rounded-[12px] opacity-20"></main>
        </div>
    </div>

    <!-- Capture Overlay Layer -->
    <div class="capture-overlay" id="capture-overlay">
        
        <!-- Mode Switcher Toolbar (Top Center) -->
        <div class="absolute top-6 left-1/2 -translate-x-1/2 flex items-center bg-[rgba(32,32,32,0.85)] backdrop-blur-md border border-white/10 rounded-[8px] p-1 shadow-fluent z-50">
            
            <button class="flex items-center justify-center w-10 h-8 rounded-[4px] bg-windows-accent/20 text-windows-accent border border-windows-accent/30" title="Region Capture">
                <i class="fa-solid fa-crop-simple text-sm"></i>
            </button>
            
            <div class="w-[1px] h-4 bg-white/10 mx-1"></div>
            
            <button class="flex items-center justify-center w-10 h-8 rounded-[4px] text-windows-textMuted hover:bg-white/10 hover:text-white transition-colors" title="Window Capture">
                <i class="fa-regular fa-window-maximize text-sm"></i>
            </button>
            
            <div class="w-[1px] h-4 bg-white/10 mx-1"></div>
            
            <button class="flex items-center justify-center w-10 h-8 rounded-[4px] text-windows-textMuted hover:bg-white/10 hover:text-white transition-colors" title="Fullscreen Capture">
                <i class="fa-solid fa-expand text-sm"></i>
            </button>

            <div class="w-[1px] h-4 bg-white/10 mx-2"></div>

            <button class="flex items-center justify-center w-10 h-8 rounded-[4px] text-windows-textMuted hover:bg-red-500/20 hover:text-red-400 transition-colors" title="Cancel">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>

        <!-- The Crop Region -->
        <div class="crop-region" id="active-crop-region">
            <!-- Resize Handles -->
            <div class="resize-handle handle-tl"></div>
            <div class="resize-handle handle-tr"></div>
            <div class="resize-handle handle-bl"></div>
            <div class="resize-handle handle-br"></div>

            <!-- Dimensions Badge (Bottom Right of Crop) -->
            <div class="absolute -bottom-7 right-0 bg-[rgba(32,32,32,0.85)] border border-white/10 rounded-[4px] px-2 py-1 flex items-center gap-2">
                <span class="text-xs font-mono text-white">864 × 512</span>
            </div>

            <!-- Action Buttons (Bottom Center of Crop) -->
            <div class="absolute -bottom-12 left-1/2 -translate-x-1/2 flex items-center gap-2">
                <button class="fluent-button bg-[rgba(32,32,32,0.85)] border border-white/10 text-white hover:bg-white/10 w-8 h-8 rounded-full flex items-center justify-center shadow-lg transition-all">
                    <i class="fa-solid fa-copy text-xs"></i>
                </button>
                <button class="fluent-button bg-windows-accent border border-transparent text-white hover:bg-windows-accentHover w-10 h-10 rounded-full flex items-center justify-center shadow-lg shadow-[rgba(0,120,212,0.3)] transition-all">
                    <i class="fa-solid fa-check text-sm"></i>
                </button>
                <button class="fluent-button bg-[rgba(32,32,32,0.85)] border border-white/10 text-white hover:bg-white/10 w-8 h-8 rounded-full flex items-center justify-center shadow-lg transition-all">
                    <i class="fa-solid fa-floppy-disk text-xs"></i>
                </button>
            </div>
        </div>

        <!-- Cursor Tooltip (Simulated position near mouse) -->
        <!-- In reality, this follows mousemove events. Here it's statically positioned for the mockup -->
        <div class="absolute top-[40%] left-[60%] bg-[rgba(17,17,17,0.9)] border border-white/10 rounded-[6px] p-2 flex flex-col gap-1 shadow-fluent pointer-events-none z-50">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-crosshairs text-windows-textMuted text-[10px]"></i>
                <span class="text-[10px] font-mono text-white">X: 1152 Y: 410</span>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-[2px] bg-[#1e3a8a] border border-white/20"></div>
                <span class="text-[10px] font-mono text-windows-textMuted">R:0.12 G:0.23 B:0.54</span>
            </div>
        </div>

    </div>

</body>
</html>
