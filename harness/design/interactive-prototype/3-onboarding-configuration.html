<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumiere - Configuration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Segoe UI Variable', 'Segoe UI', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Consolas', 'monospace'],
                    },
                    colors: {
                        windows: {
                            bg: '#111111',
                            panel: 'rgba(32, 32, 32, 0.75)',
                            border: 'rgba(255, 255, 255, 0.08)',
                            accent: '#0078D4',
                            accentHover: '#0086F0',
                            text: '#FFFFFF',
                            textMuted: '#A0A0A0',
                        }
                    },
                    boxShadow: {
                        'fluent': '0 8px 32px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05)',
                        'fluent-inner': 'inset 0 1px 0 rgba(255, 255, 255, 0.1)',
                    },
                    backdropBlur: {
                        'mica': '60px',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            background-image: radial-gradient(circle at 50% 0%, #1e3a8a 0%, #000000 70%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .mica-panel {
            background-color: var(--tw-colors-windows-panel, rgba(32, 32, 32, 0.75));
            backdrop-filter: blur(60px);
            -webkit-backdrop-filter: blur(60px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .fluent-button {
            position: relative;
            overflow: hidden;
        }
        
        .fluent-button::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .fluent-button:hover::after {
            opacity: 1;
        }

        /* Custom Radio Button Styling */
        .fluent-radio {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            outline: none;
            transition: all 0.2s ease;
            position: relative;
            cursor: pointer;
        }
        
        .fluent-radio:checked {
            border-color: #0078D4;
        }
        
        .fluent-radio:checked::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background-color: #0078D4;
            border-radius: 50%;
        }

        /* Selection Card Styling */
        .selection-card {
            transition: all 0.2s ease;
        }
        .selection-card:has(input:checked) {
            border-color: #0078D4;
            background-color: rgba(0, 120, 212, 0.05);
        }
    </style>
</head>
<body class="text-windows-text antialiased selection:bg-windows-accent selection:text-white m-0 p-0">

    <main class="w-full max-w-[1440px] px-4 py-8 mx-auto flex flex-col items-center justify-center min-h-screen">
        
        <!-- Main Onboarding Card -->
        <div id="onboarding-card" class="mica-panel rounded-[12px] w-full max-w-[900px] overflow-hidden flex flex-col shadow-fluent relative">
            
            <!-- Highlight top edge -->
            <div class="absolute top-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>

            <!-- Header / Step Indicator -->
            <div id="onboarding-header" class="px-10 pt-8 pb-6 flex flex-col items-center border-b border-windows-border relative">
                <!-- Progress Indicator (Dots) -->
                <div class="flex items-center space-x-3 mb-6">
                    <div class="w-2.5 h-2.5 rounded-full bg-white/20 cursor-pointer hover:bg-white/40 transition-colors"></div>
                    <div class="w-8 h-[2px] bg-white/10 rounded-full"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-windows-accent shadow-[0_0_8px_rgba(0,120,212,0.6)]"></div>
                </div>
                
                <h1 class="text-2xl font-semibold tracking-tight mb-2 text-white">Default Configuration</h1>
                <p class="text-windows-textMuted text-sm text-center">Step 2/2: Choose workflow preset and output format.</p>
            </div>

            <!-- Content Area -->
            <div id="onboarding-content" class="p-10 bg-black/20 flex flex-col gap-8">
                
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    
                    <!-- Left Column: Workflow Preset -->
                    <div class="flex flex-col gap-4">
                        <h2 class="text-sm font-medium text-white/80 uppercase tracking-wider mb-2">Workflow Preset</h2>
                        
                        <!-- Option 1: HDR10 PQ -->
                        <label class="selection-card mica-panel rounded-[8px] p-5 flex items-start gap-4 border border-white/10 hover:border-white/20 cursor-pointer group">
                            <div class="pt-1">
                                <input type="radio" name="workflow-preset" value="hdr10" class="fluent-radio" checked>
                            </div>
                            <div class="flex-1">
                                <div class="flex items-center justify-between mb-1">
                                    <h3 class="text-sm font-medium text-white">HDR10 PQ (ST.2084)</h3>
                                </div>
                                <p class="text-xs text-windows-textMuted leading-relaxed mb-2">Absolute luminance mapping. Best for direct HDR display viewing and mastering.</p>
                                <div class="flex gap-2">
                                    <span class="text-[10px] bg-white/5 px-2 py-1 rounded border border-white/10 text-white/80 font-mono">Rec.2020</span>
                                    <span class="text-[10px] bg-white/5 px-2 py-1 rounded border border-white/10 text-white/80 font-mono">1000 nits</span>
                                </div>
                            </div>
                        </label>

                        <!-- Option 2: scRGB Linear -->
                        <label class="selection-card mica-panel rounded-[8px] p-5 flex items-start gap-4 border border-white/10 hover:border-white/20 cursor-pointer group">
                            <div class="pt-1">
                                <input type="radio" name="workflow-preset" value="scrgb" class="fluent-radio">
                            </div>
                            <div class="flex-1">
                                <div class="flex items-center justify-between mb-1">
                                    <h3 class="text-sm font-medium text-white">scRGB Linear</h3>
                                </div>
                                <p class="text-xs text-windows-textMuted leading-relaxed mb-2">Linear floating-point values. Ideal for compositing and post-processing pipelines.</p>
                                <div class="flex gap-2">
                                    <span class="text-[10px] bg-white/5 px-2 py-1 rounded border border-white/10 text-white/80 font-mono">fp16</span>
                                    <span class="text-[10px] bg-white/5 px-2 py-1 rounded border border-white/10 text-white/80 font-mono">Unclamped</span>
                                </div>
                            </div>
                        </label>

                        <!-- Option 3: SDR Tone-mapped -->
                        <label class="selection-card mica-panel rounded-[8px] p-5 flex items-start gap-4 border border-white/10 hover:border-white/20 cursor-pointer group">
                            <div class="pt-1">
                                <input type="radio" name="workflow-preset" value="sdr" class="fluent-radio">
                            </div>
                            <div class="flex-1">
                                <div class="flex items-center justify-between mb-1">
                                    <h3 class="text-sm font-medium text-white">SDR Tone-mapped</h3>
                                </div>
                                <p class="text-xs text-windows-textMuted leading-relaxed">Standard dynamic range. High-quality tone mapping for standard displays.</p>
                            </div>
                        </label>
                    </div>

                    <!-- Right Column: Output Format & Save Location -->
                    <div class="flex flex-col gap-8">
                        
                        <!-- Output Format -->
                        <div class="flex flex-col gap-4">
                            <h2 class="text-sm font-medium text-white/80 uppercase tracking-wider mb-2">Output Format</h2>
                            
                            <div class="grid grid-cols-1 gap-3">
                                <label class="selection-card mica-panel rounded-[8px] p-4 flex items-center gap-4 border border-white/10 hover:border-white/20 cursor-pointer">
                                    <input type="radio" name="output-format" value="avif" class="fluent-radio" checked>
                                    <div class="flex-1">
                                        <h3 class="text-sm font-medium text-white">AVIF (10-bit)</h3>
                                        <p class="text-xs text-windows-textMuted">Best compression, modern standard.</p>
                                    </div>
                                </label>

                                <label class="selection-card mica-panel rounded-[8px] p-4 flex items-center gap-4 border border-white/10 hover:border-white/20 cursor-pointer">
                                    <input type="radio" name="output-format" value="jxr" class="fluent-radio">
                                    <div class="flex-1">
                                        <h3 class="text-sm font-medium text-white">JPEG XR</h3>
                                        <p class="text-xs text-windows-textMuted">Native Windows HDR support.</p>
                                    </div>
                                </label>

                                <label class="selection-card mica-panel rounded-[8px] p-4 flex items-center gap-4 border border-white/10 hover:border-white/20 cursor-pointer">
                                    <input type="radio" name="output-format" value="png" class="fluent-radio">
                                    <div class="flex-1">
                                        <h3 class="text-sm font-medium text-white">PNG (16-bit)</h3>
                                        <p class="text-xs text-windows-textMuted">Lossless, tone-mapped SDR fallback.</p>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <!-- Save Location -->
                        <div class="flex flex-col gap-4">
                            <h2 class="text-sm font-medium text-white/80 uppercase tracking-wider mb-2">Default Directory</h2>
                            
                            <div class="mica-panel rounded-[8px] p-4 border border-white/10">
                                <p class="text-xs text-windows-textMuted mb-3">Choose where screenshots are saved automatically.</p>
                                <div class="flex items-center gap-2 bg-black/40 p-2.5 rounded-[6px] border border-white/5">
                                    <i class="fa-regular fa-folder-open text-windows-accent text-sm ml-2"></i>
                                    <input type="text" value="C:\Users\Admin\Pictures\Lumiere" class="bg-transparent border-none text-sm text-white/90 w-full focus:outline-none font-mono" readonly>
                                    <button class="text-xs bg-white/10 hover:bg-white/20 text-white px-3 py-1.5 rounded transition-colors whitespace-nowrap">Browse...</button>
                                </div>
                            </div>
                        </div>

                    </div>

                </div>
            </div>

            <!-- Footer Actions -->
            <div id="primary-action-footer" class="p-8 pt-6 flex items-center justify-between border-t border-windows-border bg-black/60">
                <div class="flex items-center gap-4">
                    <a href="2-onboarding-permissions.html" class="text-sm font-medium text-windows-textMuted hover:text-white transition-colors px-4 py-2 rounded-[6px] hover:bg-white/5 border border-transparent flex items-center">
                        <i class="fa-solid fa-arrow-left mr-2 text-xs"></i> Back
                    </a>
                    <a href="11-dashboard.html" class="text-sm font-medium text-windows-textMuted hover:text-white transition-colors px-4 py-2 rounded-[6px] hover:bg-white/5 border border-transparent">
                        Skip
                    </a>
                </div>
                
                <a href="11-dashboard.html" class="fluent-button bg-windows-accent hover:bg-windows-accentHover text-white text-sm font-medium px-8 py-2.5 rounded-[6px] shadow-[inset_0_1px_0_rgba(255,255,255,0.2)] transition-all flex items-center group">
                    Finish Setup
                    <i class="fa-solid fa-check ml-2 text-xs"></i>
                </a>
            </div>

        </div>
        
        <!-- Subtle background watermark/text -->
        <div class="fixed bottom-6 right-8 text-[#ffffff10] text-xs font-mono pointer-events-none select-none">
            Lumiere Build 2026.4.20
        </div>
    </main>

</body>
</html>
