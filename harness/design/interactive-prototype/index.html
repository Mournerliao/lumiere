<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumiere - Interactive Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Segoe UI Variable', 'Segoe UI', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Consolas', 'monospace'],
                    },
                    colors: {
                        windows: {
                            bg: '#111111',
                            panel: 'rgba(32, 32, 32, 0.75)',
                            border: 'rgba(255, 255, 255, 0.08)',
                            accent: '#0078D4',
                            accentHover: '#0086F0',
                            text: '#FFFFFF',
                            textMuted: '#A0A0A0',
                        }
                    },
                    boxShadow: {
                        'fluent': '0 8px 32px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05)',
                        'fluent-inner': 'inset 0 1px 0 rgba(255, 255, 255, 0.1)',
                    },
                    backdropBlur: {
                        'mica': '60px',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            background-image: radial-gradient(circle at 50% 0%, #1e3a8a 0%, #000000 70%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .mica-panel {
            background-color: var(--tw-colors-windows-panel, rgba(32, 32, 32, 0.75));
            backdrop-filter: blur(60px);
            -webkit-backdrop-filter: blur(60px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .fluent-button {
            position: relative;
            overflow: hidden;
        }
        
        .fluent-button::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .fluent-button:hover::after {
            opacity: 1;
        }
    </style>
</head>
<body class="text-windows-text antialiased selection:bg-windows-accent selection:text-white">

    <main class="w-full max-w-4xl px-4 py-8 mx-auto flex flex-col items-center justify-center min-h-screen">
        
        <!-- Main Card -->
        <div class="mica-panel rounded-[12px] w-full max-w-[800px] overflow-hidden flex flex-col shadow-fluent relative">
            
            <!-- Highlight top edge -->
            <div class="absolute top-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>

            <!-- Header -->
            <div class="p-10 pb-6 text-center flex flex-col items-center border-b border-windows-border">
                <div class="w-20 h-20 mb-6 rounded-2xl bg-gradient-to-br from-[#0078D4] to-[#004A8A] p-0.5 shadow-lg relative">
                    <div class="w-full h-full bg-[#111] rounded-[15px] flex items-center justify-center relative overflow-hidden">
                        <div class="absolute inset-0 bg-gradient-to-br from-[#0078D4]/20 to-transparent"></div>
                        <i class="fa-solid fa-camera-retro text-3xl text-white relative z-10 drop-shadow-md"></i>
                        <div class="absolute w-8 h-8 rounded-full border-2 border-[#0078D4]/50 top-2 right-2 blur-[1px]"></div>
                    </div>
                </div>
                
                <h1 class="text-3xl font-semibold tracking-tight mb-3 text-white">Lumiere Interactive Prototype</h1>
                <p class="text-windows-textMuted text-base max-w-md mx-auto leading-relaxed">
                    可连续交互的设计稿原型。点击下方链接浏览各个页面。
                </p>
            </div>

            <!-- Links Grid -->
            <div class="p-10 bg-black/20">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    
                    <!-- Onboarding Flow -->
                    <div class="mica-panel rounded-[8px] p-5 border border-white/10">
                        <h3 class="text-sm font-semibold text-white mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-route text-windows-accent"></i>
                            引导流程
                        </h3>
                        <div class="flex flex-col gap-2">
                            <a href="1-welcome.html" class="flex items-center gap-3 px-3 py-2 rounded-[6px] text-windows-textMuted hover:text-white hover:bg-white/5 border border-transparent transition-colors group">
                                <span class="w-6 h-6 rounded-full bg-windows-accent/20 text-windows-accent text-xs flex items-center justify-center">1</span>
                                <span class="text-sm">欢迎页</span>
                            </a>
                            <a href="2-onboarding-permissions.html" class="flex items-center gap-3 px-3 py-2 rounded-[6px] text-windows-textMuted hover:text-white hover:bg-white/5 border border-transparent transition-colors group">
                                <span class="w-6 h-6 rounded-full bg-windows-accent/20 text-windows-accent text-xs flex items-center justify-center">2</span>
                                <span class="text-sm">权限设置</span>
                            </a>
                            <a href="3-onboarding-configuration.html" class="flex items-center gap-3 px-3 py-2 rounded-[6px] text-windows-textMuted hover:text-white hover:bg-white/5 border border-transparent transition-colors group">
                                <span class="w-6 h-6 rounded-full bg-windows-accent/20 text-windows-accent text-xs flex items-center justify-center">3</span>
                                <span class="text-sm">默认配置</span>
                            </a>
                        </div>
                    </div>

                    <!-- Main App -->
                    <div class="mica-panel rounded-[8px] p-5 border border-white/10">
                        <h3 class="text-sm font-semibold text-white mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-house text-windows-accent"></i>
                            主界面
                        </h3>
                        <div class="flex flex-col gap-2">
                            <a href="11-dashboard.html" class="flex items-center gap-3 px-3 py-2 rounded-[6px] text-windows-textMuted hover:text-white hover:bg-white/5 border border-transparent transition-colors group">
                                <i class="fa-solid fa-gauge-high w-5 text-center text-sm group-hover:text-windows-accent transition-colors"></i>
                                <span class="text-sm">仪表板</span>
                            </a>
                            <a href="10-gallery.html" class="flex items-center gap-3 px-3 py-2 rounded-[6px] text-windows-textMuted hover:text-white hover:bg-white/5 border border-transparent transition-colors group">
                                <i class="fa-regular fa-images w-5 text-center text-sm group-hover:text-windows-accent transition-colors"></i>
                                <span class="text-sm">截图库</span>
                            </a>
                        </div>
                    </div>

                    <!-- Capture -->
                    <div class="mica-panel rounded-[8px] p-5 border border-white/10">
                        <h3 class="text-sm font-semibold text-white mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-crop-simple text-windows-accent"></i>
                            截图功能
                        </h3>
                        <div class="flex flex-col gap-2">
                            <a href="8-capture-overlay.html" class="flex items-center gap-3 px-3 py-2 rounded-[6px] text-windows-textMuted hover:text-white hover:bg-white/5 border border-transparent transition-colors group">
                                <i class="fa-solid fa-crop w-5 text-center text-sm group-hover:text-windows-accent transition-colors"></i>
                                <span class="text-sm">区域选择</span>
                            </a>
                            <a href="9-capture-overlay-annotated.html" class="flex items-center gap-3 px-3 py-2 rounded-[6px] text-windows-textMuted hover:text-white hover:bg-white/5 border border-transparent transition-colors group">
                                <i class="fa-solid fa-pen-nib w-5 text-center text-sm group-hover:text-windows-accent transition-colors"></i>
                                <span class="text-sm">标注工具</span>
                            </a>
                        </div>
                    </div>

                    <!-- Settings -->
                    <div class="mica-panel rounded-[8px] p-5 border border-white/10">
                        <h3 class="text-sm font-semibold text-white mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-gear text-windows-accent"></i>
                            设置页面
                        </h3>
                        <div class="flex flex-col gap-2">
                            <a href="4-settings-general.html" class="flex items-center gap-3 px-3 py-2 rounded-[6px] text-windows-textMuted hover:text-white hover:bg-white/5 border border-transparent transition-colors group">
                                <i class="fa-solid fa-sliders w-5 text-center text-sm group-hover:text-windows-accent transition-colors"></i>
                                <span class="text-sm">通用设置</span>
                            </a>
                            <a href="5-settings-shortcuts.html" class="flex items-center gap-3 px-3 py-2 rounded-[6px] text-windows-textMuted hover:text-white hover:bg-white/5 border border-transparent transition-colors group">
                                <i class="fa-solid fa-keyboard w-5 text-center text-sm group-hover:text-windows-accent transition-colors"></i>
                                <span class="text-sm">快捷键设置</span>
                            </a>
                            <a href="6-settings-hdr.html" class="flex items-center gap-3 px-3 py-2 rounded-[6px] text-windows-textMuted hover:text-white hover:bg-white/5 border border-transparent transition-colors group">
                                <i class="fa-solid fa-palette w-5 text-center text-sm group-hover:text-windows-accent transition-colors"></i>
                                <span class="text-sm">HDR与色彩</span>
                            </a>
                            <a href="7-settings-output.html" class="flex items-center gap-3 px-3 py-2 rounded-[6px] text-windows-textMuted hover:text-white hover:bg-white/5 border border-transparent transition-colors group">
                                <i class="fa-solid fa-file-export w-5 text-center text-sm group-hover:text-windows-accent transition-colors"></i>
                                <span class="text-sm">输出设置</span>
                            </a>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Footer -->
            <div class="px-10 py-6 border-t border-windows-border bg-black/40 flex items-center justify-end">
                <div class="text-xs text-windows-textMuted font-mono">
                    Lumiere Build 2026.4.20
                </div>
            </div>

        </div>
    </main>

</body>
</html>
